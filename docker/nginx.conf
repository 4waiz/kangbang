# ---------------------------------------------------------------------------
# KANG BANG - client edge configuration.
#
# Serves the static bundle and proxies the API and the game socket to the
# `server` service, so the browser sees a single origin.
# ---------------------------------------------------------------------------

upstream kang_server {
    server server:2567;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GLB models and generated textures compress well and are the bulk of the
    # payload. Vite already fingerprints filenames, so long caching is safe.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml model/gltf-binary application/octet-stream;

    # A stray upstream error must never be reported as a game bug.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://kang_server;
        proxy_set_header Connection "";
    }

    # The game socket. `Upgrade`/`Connection` must be forwarded verbatim or the
    # handshake fails, and the read timeout has to outlast a whole match.
    location /ws {
        proxy_pass http://kang_server;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Hashed build output: immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Generated GLB models are content-stable but not hashed, so revalidate.
    location /models/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or players get a stale client
    # pointing at hashed bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
